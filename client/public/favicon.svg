<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gossip Girl Guide">
  <title>Gossip Girl Guide</title>
  <defs>
    <!-- 深色底：与站点背景一致的炭黑 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15151f" />
      <stop offset="100%" stop-color="#08080d" />
    </linearGradient>
    <!-- 金色王冠 -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4cd92" />
      <stop offset="55%" stop-color="#e0aa62" />
      <stop offset="100%" stop-color="#c99049" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" fill="url(#bg)" />
  <!-- 极淡的金色光晕，让图标在小尺寸下不发闷 -->
  <circle cx="32" cy="34" r="26" fill="#d4a574" opacity="0.10" />

  <!-- 王冠主体 -->
  <path d="M14 42V21l10 11 8-16 8 16 10-11v21z" fill="url(#gold)" />
  <!-- 冠底 -->
  <rect x="14" y="44" width="36" height="6" rx="3" fill="url(#gold)" />
  <!-- 冠尖珍珠 -->
  <g fill="#f7dcb4">
    <circle cx="14" cy="19" r="3" />
    <circle cx="32" cy="14" r="3" />
    <circle cx="50" cy="19" r="3" />
  </g>
</svg>
