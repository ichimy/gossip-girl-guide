<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 560" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Upper East Side skyline at dusk">
  <title>Upper East Side skyline at dusk</title>
  <defs>
    <!-- 黄昏天空：上暗下亮，靠地平线烧成金玫瑰色 -->
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1524" stop-opacity="0" />
      <stop offset="34%" stop-color="#2e1e2c" stop-opacity="0.55" />
      <stop offset="66%" stop-color="#6d403f" stop-opacity="0.62" />
      <stop offset="86%" stop-color="#a97a4c" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c79a62" stop-opacity="0.42" />
    </linearGradient>
    <!-- 地平线光核 -->
    <radialGradient id="core" cx="50%" cy="62%" r="55%">
      <stop offset="0%" stop-color="#f2c88a" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#d4956a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#b8748a" stop-opacity="0" />
    </radialGradient>
    <!-- 远山/远楼剪影 -->
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b2c3a" />
      <stop offset="100%" stop-color="#1d1826" />
    </linearGradient>
    <!-- 近景建筑剪影 -->
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0b14" />
      <stop offset="100%" stop-color="#050409" />
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0a14" />
      <stop offset="100%" stop-color="#05040a" />
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe0ae" />
      <stop offset="100%" stop-color="#e2a75f" />
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2c88a" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#f2c88a" stop-opacity="0" />
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <filter id="softSm" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- 黄昏天空 -->
  <rect width="1920" height="560" fill="url(#dusk)" />
  <rect width="1920" height="560" fill="url(#core)" />

  <!-- 稀疏星点（天空上缘） -->
  <g fill="#ffe9cf" opacity="0.5">
    <circle cx="164" cy="34" r="1.5" /><circle cx="428" cy="18" r="1.2" />
    <circle cx="690" cy="46" r="1.3" /><circle cx="968" cy="26" r="1.2" />
    <circle cx="1214" cy="52" r="1.4" /><circle cx="1478" cy="30" r="1.2" />
    <circle cx="1712" cy="58" r="1.3" /><circle cx="286" cy="72" r="1.1" />
  </g>

  <!-- ===== 远景曼哈顿天际线剪影 ===== -->
  <g fill="url(#far)">
    <rect x="0" y="232" width="62" height="120" /><rect x="62" y="206" width="44" height="146" />
    <rect x="106" y="248" width="66" height="104" /><rect x="172" y="184" width="40" height="168" />
    <rect x="212" y="228" width="58" height="124" /><rect x="270" y="256" width="48" height="96" />
    <rect x="318" y="196" width="54" height="156" /><rect x="372" y="238" width="46" height="114" />
    <rect x="418" y="168" width="44" height="184" /><rect x="462" y="226" width="60" height="126" />
    <rect x="522" y="252" width="42" height="100" /><rect x="564" y="192" width="52" height="160" />
    <rect x="616" y="232" width="58" height="120" /><rect x="674" y="260" width="44" height="92" />
    <rect x="718" y="178" width="40" height="174" /><rect x="758" y="224" width="56" height="128" />
    <rect x="814" y="248" width="50" height="104" /><rect x="864" y="200" width="46" height="152" />
    <rect x="910" y="236" width="62" height="116" /><rect x="972" y="262" width="44" height="90" />
    <rect x="1016" y="186" width="52" height="166" /><rect x="1068" y="230" width="48" height="122" />
    <rect x="1116" y="254" width="58" height="98" /><rect x="1174" y="194" width="44" height="158" />
    <rect x="1218" y="234" width="56" height="118" /><rect x="1274" y="260" width="46" height="92" />
    <rect x="1320" y="176" width="48" height="176" /><rect x="1368" y="228" width="58" height="124" />
    <rect x="1426" y="250" width="44" height="102" /><rect x="1470" y="190" width="52" height="162" />
    <rect x="1522" y="232" width="50" height="120" /><rect x="1572" y="208" width="44" height="144" />
    <rect x="1616" y="252" width="60" height="100" /><rect x="1676" y="188" width="42" height="164" />
    <rect x="1718" y="230" width="56" height="122" /><rect x="1774" y="256" width="46" height="96" />
    <rect x="1820" y="196" width="50" height="156" /><rect x="1870" y="238" width="50" height="114" />
  </g>
  <!-- 两座地标塔楼 -->
  <g fill="#2a2131">
    <path d="M846 352V196h54v156z" /><rect x="864" y="150" width="18" height="46" /><rect x="871" y="120" width="5" height="30" />
    <path d="M1362 352V214h46v138z" /><path d="M1368 214h34l-17-28z" /><rect x="1381" y="164" width="8" height="24" />
  </g>
  <!-- 远景窗光 -->
  <g fill="#ffd9a0" opacity="0.62">
    <rect x="76" y="222" width="4" height="6" /><rect x="92" y="240" width="4" height="6" />
    <rect x="182" y="200" width="4" height="6" /><rect x="182" y="234" width="4" height="6" />
    <rect x="330" y="212" width="4" height="6" /><rect x="346" y="230" width="4" height="6" />
    <rect x="428" y="184" width="4" height="6" /><rect x="428" y="218" width="4" height="6" />
    <rect x="574" y="208" width="4" height="6" /><rect x="590" y="226" width="4" height="6" />
    <rect x="728" y="194" width="4" height="6" /><rect x="728" y="228" width="4" height="6" />
    <rect x="874" y="164" width="4" height="6" /><rect x="874" y="198" width="4" height="6" />
    <rect x="1026" y="202" width="4" height="6" /><rect x="1042" y="220" width="4" height="6" />
    <rect x="1184" y="210" width="4" height="6" /><rect x="1184" y="244" width="4" height="6" />
    <rect x="1378" y="196" width="4" height="6" /><rect x="1394" y="214" width="4" height="6" />
    <rect x="1480" y="206" width="4" height="6" /><rect x="1480" y="240" width="4" height="6" />
    <rect x="1686" y="204" width="4" height="6" /><rect x="1686" y="238" width="4" height="6" />
    <rect x="1830" y="212" width="4" height="6" /><rect x="1846" y="230" width="4" height="6" />
  </g>

  <!-- 地平线光带 -->
  <ellipse cx="960" cy="356" rx="900" ry="40" fill="#f2c88a" opacity="0.2" filter="url(#soft)" />

  <!-- ===== 近景：两侧褐石联排建筑剪影 ===== -->
  <g fill="url(#near)">
    <path d="M0 560V318h138v242zM138 560V344h112v216zM250 560V368h100v192zM350 560V392h96v168z" />
    <path d="M1920 560V318h-138v242zM1782 560V344h-112v216zM1670 560V368h-100v192zM1570 560V392h-96v168z" />
  </g>
  <!-- 屋檐与女儿墙 -->
  <g fill="#221c2b">
    <rect x="0" y="310" width="140" height="10" /><rect x="136" y="336" width="116" height="9" />
    <rect x="248" y="360" width="104" height="9" /><rect x="348" y="384" width="100" height="9" />
    <rect x="1780" y="310" width="140" height="10" /><rect x="1768" y="336" width="116" height="9" />
    <rect x="1668" y="360" width="104" height="9" /><rect x="1572" y="384" width="100" height="9" />
  </g>
  <!-- 近景窗光（大颗、明亮） -->
  <g fill="url(#win)">
    <g opacity="0.95">
      <rect x="26" y="356" width="16" height="22" rx="1" /><rect x="76" y="356" width="16" height="22" rx="1" />
      <rect x="26" y="408" width="16" height="22" rx="1" opacity="0.6" />
      <rect x="76" y="408" width="16" height="22" rx="1" />
      <rect x="26" y="460" width="16" height="22" rx="1" /><rect x="76" y="460" width="16" height="22" rx="1" opacity="0.5" />
      <rect x="158" y="380" width="15" height="20" rx="1" /><rect x="202" y="380" width="15" height="20" rx="1" opacity="0.55" />
      <rect x="158" y="428" width="15" height="20" rx="1" opacity="0.7" /><rect x="202" y="428" width="15" height="20" rx="1" />
      <rect x="266" y="402" width="14" height="19" rx="1" /><rect x="306" y="402" width="14" height="19" rx="1" opacity="0.6" />
      <rect x="266" y="448" width="14" height="19" rx="1" opacity="0.55" /><rect x="306" y="448" width="14" height="19" rx="1" />
      <rect x="366" y="424" width="14" height="18" rx="1" /><rect x="404" y="424" width="14" height="18" rx="1" opacity="0.65" />
    </g>
    <g opacity="0.95">
      <rect x="1878" y="356" width="16" height="22" rx="1" /><rect x="1828" y="356" width="16" height="22" rx="1" />
      <rect x="1878" y="408" width="16" height="22" rx="1" opacity="0.6" />
      <rect x="1828" y="408" width="16" height="22" rx="1" />
      <rect x="1878" y="460" width="16" height="22" rx="1" /><rect x="1828" y="460" width="16" height="22" rx="1" opacity="0.5" />
      <rect x="1746" y="380" width="15" height="20" rx="1" /><rect x="1702" y="380" width="15" height="20" rx="1" opacity="0.55" />
      <rect x="1746" y="428" width="15" height="20" rx="1" opacity="0.7" /><rect x="1702" y="428" width="15" height="20" rx="1" />
      <rect x="1638" y="402" width="14" height="19" rx="1" /><rect x="1598" y="402" width="14" height="19" rx="1" opacity="0.6" />
      <rect x="1638" y="448" width="14" height="19" rx="1" opacity="0.55" /><rect x="1598" y="448" width="14" height="19" rx="1" />
      <rect x="1538" y="424" width="14" height="18" rx="1" /><rect x="1500" y="424" width="14" height="18" rx="1" opacity="0.65" />
    </g>
  </g>

  <!-- 门口灯 -->
  <g filter="url(#softSm)">
    <circle cx="68" cy="512" r="34" fill="url(#lamp)" />
    <circle cx="186" cy="512" r="28" fill="url(#lamp)" />
    <circle cx="300" cy="512" r="24" fill="url(#lamp)" />
    <circle cx="404" cy="512" r="20" fill="url(#lamp)" />
    <circle cx="1848" cy="512" r="34" fill="url(#lamp)" />
    <circle cx="1730" cy="512" r="28" fill="url(#lamp)" />
    <circle cx="1616" cy="512" r="24" fill="url(#lamp)" />
    <circle cx="1512" cy="512" r="20" fill="url(#lamp)" />
  </g>

  <!-- 街面与反光 -->
  <rect y="544" width="1920" height="16" fill="url(#base)" />
  <g opacity="0.5" filter="url(#softSm)">
    <rect x="60" y="544" width="18" height="16" fill="#f2c88a" />
    <rect x="178" y="544" width="16" height="16" fill="#f2c88a" />
    <rect x="292" y="544" width="14" height="16" fill="#f2c88a" />
    <rect x="1840" y="544" width="18" height="16" fill="#f2c88a" />
    <rect x="1722" y="544" width="16" height="16" fill="#f2c88a" />
    <rect x="1608" y="544" width="14" height="16" fill="#f2c88a" />
  </g>
</svg>
